<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 80 134" width="400" height="670">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="eyeL"><circle cx="20" cy="36" r="12"/></clipPath>
    <clipPath id="eyeR"><circle cx="52" cy="36" r="12"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Ambient glow behind body -->
  <ellipse cx="40" cy="50" rx="22" ry="22" fill="#c4b5fd" opacity="0.35" filter="url(#glow)"/>

  <!-- Antenna stick -->
  <rect x="38.5" y="7" width="3" height="16" rx="1.5" fill="#c4b5fd"/>

  <!-- Antenna ball -->
  <circle cx="40" cy="1" r="6" fill="#ddd6fe"/>
  <circle cx="40" cy="1" r="6" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>

  <!-- Body -->
  <rect x="0" y="10" width="80" height="80" rx="24" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Feet (drawn on top of body) -->
  <circle cx="18" cy="86" r="10" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="62" cy="86" r="10" fill="#8b5cf6" stroke="#c4b5fd" stroke-width="2"/>

  <!-- Left eye -->
  <circle cx="20" cy="36" r="12" fill="white"/>
  <g clip-path="url(#eyeL)">
    <circle cx="20" cy="36" r="7" fill="#8b5cf6"/>
    <circle cx="20" cy="36" r="4" fill="#5b21b6"/>
    <circle cx="23" cy="33" r="2" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- Right eye -->
  <circle cx="52" cy="36" r="12" fill="white"/>
  <g clip-path="url(#eyeR)">
    <circle cx="52" cy="36" r="7" fill="#8b5cf6"/>
    <circle cx="52" cy="36" r="4" fill="#5b21b6"/>
    <circle cx="55" cy="33" r="2" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- Cheeks -->
  <ellipse cx="18" cy="54" rx="10" ry="6" fill="rgba(253,164,175,0.55)"/>
  <ellipse cx="62" cy="54" rx="10" ry="6" fill="rgba(253,164,175,0.55)"/>

  <!-- Smile -->
  <path d="M29 51 Q40 60 51 51" stroke="rgba(255,255,255,0.88)" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- pip label -->
  <text x="40" y="108" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="9" font-weight="600"
        fill="rgba(167,139,250,0.7)" letter-spacing="2">pip</text>
</svg>
